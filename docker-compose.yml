networks:
  condo-net:
services:
  #PHP Service
  condo_php:
    build:
      context: .
      dockerfile: Dockerfile
    image: condo/php:latest
    container_name: condo_php
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: condo_php
      SERVICE_TAGS: dev
      XDEBUG_MODE: debug
      XDEBUG_CONFIG: client_host=host.docker.internal client_port=9003
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
      - ./logs/php.log:/var/log/fpm-php.www.log
      - ./docker-config/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - condo-net
    depends_on:
      - condo_mariadb

  # Frontend watcher for bind-mounted development files
  condo_frontend:
    image: condo/php:latest
    container_name: condo_frontend
    user: root
    working_dir: /var/www/html
    command: sh -c "npm install && npm run watch-poll"
    volumes:
      - ./:/var/www/html
      - /var/www/html/node_modules
    networks:
      - condo-net

  #Nginx Service
  condo_nginx:
    image: nginx:alpine
    container_name: condo_nginx
    restart: unless-stopped
    tty: true
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./:/var/www/html
      - ./docker-config/nginx/conf.d/:/etc/nginx/conf.d/
      - ./logs/nginx:/var/log/nginx/
    depends_on:
      - condo_php
      - condo_mariadb

    networks:
      - condo-net

  #MySQL Service
  condo_mariadb:
    image: mariadb
    container_name: condo_mariadb
    restart: always
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: "condo"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "root"
      MYSQL_ROOT_PASSWORD: "root"
      SERVICE_TAGS: "dev"
      SERVICE_NAME: condo_mariadb
    volumes:
      - ./dbdata:/var/lib/mysql
      - ./docker-config/mysql/my.cnf:/etc/mysql/my.cnf
    networks:
      - condo-net

#Docker Networks

#Volumes
volumes:
  dbdata:
    driver: local
